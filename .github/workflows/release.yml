name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    permissions: write-all
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: ""
      CHANNEL_ID: ""
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Get version and SHA
        id: vars
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -n 's/.*versionName = "\([^ ]*\).*/\1/p')
          SHA8=$(git rev-parse --short=8 HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION-$SHA8" >> $GITHUB_OUTPUT

      - name: Write key
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
        run: |
          if [ ! -z "$KEY_STORE" ]; then
          echo androidStorePassword='${{ secrets.KEY_STORE_PASSWORD }}' >> gradle.properties
          echo androidKeyAlias='${{ secrets.ALIAS }}' >> gradle.properties
          echo androidKeyPassword='${{ secrets.KEY_PASSWORD }}' >> gradle.properties
          echo androidStoreFile='key.jks' >> gradle.properties
          echo "$KEY_STORE" | base64 --decode > key.jks
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug -Pminify=true

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: RHpatch ${{ steps.vars.outputs.version }}
          body_path: changelog.txt
          files: ${{ steps.find_apk.outputs.apk_path }}
          tag_name: ${{ steps.vars.outputs.tag }}

      - name: Read changelog
        id: changelog
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const changelog = fs.readFileSync('changelog.txt', 'utf8').trim();
            // Telegram message limit is 4096 characters. We truncate to 3500 to leave room for the header and footer.
            const truncated = changelog.length > 3500 ? changelog.substring(0, 3500) + '\n\n... (Lihat selengkapnya di GitHub)' : changelog;
            core.setOutput('content', truncated);

      - name: Post to Telegram channel
        if: ${{ env.BOT_TOKEN != '' }}
        uses: appleboy/telegram-action@master
        with:
          to: ${{ env.CHANNEL_ID }}
          token: ${{ env.BOT_TOKEN }}
          format: markdown
          disable_web_page_preview: true
          document: ${{ steps.find_apk.outputs.apk_path }}
          message: |
            🚀 *New RHpatch Release* 🚀

            ${{ steps.changelog.outputs.content }}

            🔗 *Release Link*: https://github.com/${{ github.repository }}/releases/tag/${{ steps.vars.outputs.tag }}
